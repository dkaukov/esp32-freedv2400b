[platformio]
src_dir = .

[env:esp32dev]
platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
lib_extra_dirs = ../../..

[env:esp32s3]
platform = platformio/espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600
lib_extra_dirs = ../../..
